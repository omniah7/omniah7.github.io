     <!-- ============================================================
         THEME FLASH PREVENTION
         This MUST run BEFORE any CSS loads to prevent FOWT
         (Flash of Wrong Theme) when navigating between pages.
         ============================================================ -->
    <script>
        (function() {
            // Immediately check localStorage for saved theme preference
            // This runs synchronously before the page renders,
            // preventing the "flash" of dark mode on light mode users
            const savedMode = localStorage.getItem('omniah_portfolio_mode');
            if (savedMode === 'light') {
                document.documentElement.classList.add('light-mode');
            }
            // Also set language direction immediately to prevent layout shift
            const savedLang = localStorage.getItem('omniah_portfolio_lang');
            if (savedLang === 'ar') {
                document.documentElement.dir = 'rtl';
                document.documentElement.lang = 'ar';
            }
        })();
    </script>
    
</head>
