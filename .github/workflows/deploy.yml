name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject EmailJS Keys
        run: |
          # Replace only the actual placeholder values, not comments
          sed -i 's|emailjs.init("TEMPORARY_PUBLIC_KEY")|emailjs.init("${{ secrets.EMAILJS_PUBLIC_KEY }}")|g' assets/js/contact.js
          sed -i "s|'TEMPORARY_SERVICE_ID'|'${{ secrets.EMAILJS_SERVICE_ID }}'|g" assets/js/contact.js
          sed -i "s|'TEMPORARY_TEMPLATE_ID'|'${{ secrets.EMAILJS_TEMPLATE_ID }}'|g" assets/js/contact.js
          
          echo "✅ Keys injected"
          
          # Verify — check that the actual code lines changed
          echo "--- emailjs.init line ---"
          grep "emailjs.init" assets/js/contact.js
          echo "--- emailjs.sendForm line ---"
          grep "emailjs.sendForm" assets/js/contact.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
